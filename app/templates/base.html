<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrailMind — Model Catalog</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151c'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='%232b3240'/%3E%3Crect x='6' y='18' width='5' height='9' rx='1.5' fill='%235ec8d8'/%3E%3Crect x='13.5' y='12' width='5' height='15' rx='1.5' fill='%23e8a33d'/%3E%3Crect x='21' y='6' width='5' height='21' rx='1.5' fill='%23a78bfa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
</head>
<body>
<!--
  Each route renders only its own screen's markup (app/templates/*.html, each extending
  this shell and filling in the content block below) — base.html itself holds only what's
  genuinely shared across every screen: the head and the single nav bar. This is now the
  tenant/platform-admin console only — the AI-engineer self-service catalog/dashboard/
  activity surface was removed as part of the platform pivot to a multi-tenant, embeddable
  widget product (docs/design/09-Platform-Pivot-Decision.md); the reference tenant's own
  end-user surface returns with the tracker SDK phase, built on anonymous visitor identity
  rather than a cookie-session login.
-->
<header class="app-nav" id="app-nav" data-state="none">
  <div class="brand"><svg class="brand-mark" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="10" width="3.4" height="7" rx="1" fill="var(--cyan)"/><rect x="6.3" y="6" width="3.4" height="11" rx="1" fill="var(--amber)"/><rect x="11.6" y="2" width="3.4" height="15" rx="1" fill="var(--violet)"/></svg>TRAILMIND <small id="brand-sub">/ admin console</small></div>
  <nav class="nav-links admin-links">
    <div class="nav-link" data-page="admin-overview" onclick="go('admin-overview')">Overview</div>
    <div class="nav-link" data-page="admin-models" onclick="go('admin-models')">Catalog</div>
    <div class="nav-link" data-page="admin-users" onclick="go('admin-users')">Users</div>
    <div class="nav-link" data-page="observability" onclick="go('observability')">Observability</div>
  </nav>
  <div class="app-nav-spacer"></div>
  <div class="persona-pill" id="persona-pill">not signed in</div>
  <div class="logout-link" onclick="logout()">Log out</div>
</header>

{% block content %}{% endblock %}

<script src="/static/js/app.js?v={{ js_version }}"></script>
<script>
  window.INITIAL_PAGE = {{ initial_page|tojson }};
  if (typeof setSessionRole === 'function') setSessionRole({{ session_role|tojson }});
  if (typeof initPage === 'function') initPage(window.INITIAL_PAGE);
</script>
</body>
</html>
